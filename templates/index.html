<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SafeTrack</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><link rel="stylesheet" href="/static/style.css"></head><body><header><b>SafeTrack</b><span id="status">Not signed in</span></header><main>
<section id="auth" class="card"><h2>Account</h2><input id="name" placeholder="Name"><input id="email" placeholder="Email"><input id="phone" placeholder="Phone with country code"><input id="password" type="password" placeholder="Password (10+ characters)"><button onclick="signup()">Create account</button><button onclick="signin()">Sign in</button><p id="authmsg"></p></section>
<div id="dashboard" hidden><div class="cols"><section class="card"><h2>Register vehicle</h2><input id="reg" placeholder="Vehicle number, e.g. KA01AB1234"><input id="label" placeholder="Bike / car label"><button onclick="addVehicle()">Register</button><p id="secret"></p></section><section class="card"><h2>Emergency contact</h2><input id="cname" placeholder="Contact name"><input id="cphone" placeholder="+91..."><button onclick="addContact()">Save contact</button><p id="contactmsg"></p></section></div>
<section class="card"><h2>Authorized vehicle tracking</h2><select id="vehicles" onchange="selectVehicle()"><option value="">Select registered vehicle</option></select><button class="sos" onclick="sos()">SOS — SEND ALERT</button><div id="map"></div><p id="info">Location updates appear here.</p></section>
<section class="card"><h2>Share access</h2><input id="viewer" placeholder="Viewer's registered email"><button onclick="share()">Grant live view access</button><button onclick="signout()">Sign out</button><p id="sharemsg"></p></section></div></main>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script><script src="/static/app.js"></script></body></html>
